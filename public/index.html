<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHS Parenting Companion</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --panel: #ffffff;
      --ink: #1f2a24;
      --muted: #4c6254;
      --accent: #005eb8;
      --accent-dark: #004a92;
      --accent-light: #e8f0fe;
      --border: #d8d4cd;
      --border-dark: #8c9790;
      --disabled: #9aa3ab;
      --user-bg: #e6f0fa;
      --assistant-bg: #f3f7f4;
      --alert-bg: #fdf2f2;
      --alert-border: #d4351c;
      --focus-ring: #ffdd00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      max-width: 680px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 600px) {
      main { padding: 32px; }
    }
    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.intro {
      margin: 0;
      font-size: 16px;
      color: var(--muted);
    }
    p.emergency-notice {
      margin: 8px 0 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--alert-border);
    }
    
    /* Screen reader only utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Chat log and message bubbles */
    #response {
      min-height: 160px;
      max-height: 480px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #faf9f6;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .message-turn {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 90%;
    }
    .message-turn.user {
      align-self: flex-end;
    }
    .message-turn.assistant {
      align-self: flex-start;
    }
    .message-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 17px;
      line-height: 1.5;
    }
    .bubble-user {
      background: var(--user-bg);
      color: var(--ink);
      border: 1px solid #c5dbf2;
      border-bottom-right-radius: 2px;
    }
    .bubble-assistant {
      background: var(--assistant-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      align-self: flex-start;
    }
    .typing-indicator .dot {
      width: 8px;
      height: 8px;
      background: var(--muted);
      border-radius: 50%;
      opacity: 0.6;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .typing-indicator .dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing-indicator .dot {
        animation: none;
        opacity: 0.8;
      }
    }

    /* Safety Signpost Card */
    .signpost-card {
      margin-top: 4px;
      padding: 18px 20px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      background: var(--accent-light);
      color: var(--ink);
      width: 100%;
    }
    .signpost-card.tier-1 {
      border-color: var(--alert-border);
      background: var(--alert-bg);
    }
    .signpost-card h2 {
      margin: 0 0 8px;
      font-size: 19px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .signpost-card.tier-1 h2 {
      color: var(--alert-border);
    }
    .signpost-card p {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.5;
    }
    .signpost-card .services-list {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .signpost-card .service-item {
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
    }
    .signpost-card .service-item strong {
      color: var(--ink);
    }
    .signpost-card .service-item .contact-detail {
      font-weight: 600;
      color: var(--accent);
    }

    /* Error Message */
    .chat-error {
      padding: 12px 16px;
      background: var(--alert-bg);
      border: 1px solid var(--alert-border);
      border-radius: 8px;
      color: #7a1100;
      font-size: 16px;
    }

    /* Input area */
    form.chat-input-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input#message-input {
      flex: 1;
      font-size: 17px;
      padding: 14px 16px;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      color: var(--ink);
      background: #ffffff;
    }
    input#message-input:focus {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
      border-color: var(--accent);
    }
    button#send-button {
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    button#send-button:hover {
      background: var(--accent-dark);
    }
    button#send-button:focus {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    button#send-button:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>NHS Parenting Companion</h1>
      <p class="intro">Non-judgmental, NHS-grounded guidance for caring for your child.</p>
      <p class="emergency-notice">In an emergency or if a child is unresponsive, call 999 immediately.</p>
    </header>

    <div id="response" aria-live="polite" role="status" aria-label="Conversation history"></div>

    <form class="chat-input-form" id="chat-form" action="#">
      <label for="message-input">Your question</label>
      <div class="input-row">
        <input id="message-input" type="text" autocomplete="off" placeholder="e.g. How do I safely make up a formula bottle?" required />
        <button id="send-button" type="submit">Send</button>
      </div>
    </form>
  </main>
  <script type="module" src="./widget.js"></script>
</body>
</html>
